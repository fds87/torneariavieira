<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0A0A0A"/>
  <!-- gear body -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#C8A96E" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="2.4" fill="#C8A96E"/>
  <!-- gear teeth (8 teeth) -->
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(0 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(45 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(90 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(135 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(180 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(225 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(270 16 16)"/>
  <rect x="14.5" y="3" width="3" height="4" rx="0.6" fill="#C8A96E" transform="rotate(315 16 16)"/>
</svg>
